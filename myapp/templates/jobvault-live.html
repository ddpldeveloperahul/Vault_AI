<title>JobVault AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* JobVault AI — ink sidebar + working canvas; brass accent for actions; semantic colours for job state */
:root{
  --bg:#F1F3F6; --panel:#FFFFFF; --panel-2:#F6F7F9; --ink:#15202C; --muted:#5A6777; --line:#DCE1E8;
  --accent:#9C6B12; --accent-ink:#FFFFFF; --accent-soft:#F5EAD3;
  --side-bg:#15202C; --side-fg:#C9D2DD; --side-hi:#FFFFFF; --side-line:#26333F;
  --ok:#24734A; --ok-soft:#DCF0E3; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#A8281F; --bad-soft:#F8DEDB; --info:#235F8C; --info-soft:#DCEAF5;
  --shadow:0 1px 2px rgba(21,32,44,.06),0 10px 30px rgba(21,32,44,.10);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --panel:#141C25; --panel-2:#18222D; --ink:#E5EAF0; --muted:#93A1B1; --line:#253240;
  --accent:#D9A441; --accent-ink:#1A1206; --accent-soft:#3A2D14;
  --side-bg:#090E14; --side-fg:#9EABBA; --side-hi:#FFFFFF; --side-line:#1B2530;
  --ok:#62C48F; --ok-soft:#173826; --warn:#E8A93F; --warn-soft:#3B2B10; --bad:#F0847B; --bad-soft:#3F1E1B; --info:#7DB6E3; --info-soft:#152B3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --panel:#141C25; --panel-2:#18222D; --ink:#E5EAF0; --muted:#93A1B1; --line:#253240;
  --accent:#D9A441; --accent-ink:#1A1206; --accent-soft:#3A2D14;
  --side-bg:#090E14; --side-fg:#9EABBA; --side-hi:#FFFFFF; --side-line:#1B2530;
  --ok:#62C48F; --ok-soft:#173826; --warn:#E8A93F; --warn-soft:#3B2B10; --bad:#F0847B; --bad-soft:#3F1E1B; --info:#7DB6E3; --info-soft:#152B3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:1.65rem} h2{font-size:1.08rem} h3{font-size:.95rem}
p{margin:0}
a{color:var(--info)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.78rem}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:1.05rem}
.side .brand b{color:var(--side-hi)}
.brand small{font-size:.74rem;opacity:.8}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{color:var(--side-fg);opacity:.7;padding:0 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-line);color:var(--side-hi)}
.nav a.on{background:var(--side-line);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.count{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px}
.count.info{background:var(--info);color:var(--panel)}
.side-foot{margin-top:auto;font-size:.74rem;border-top:1px solid var(--side-line);padding:12px 8px 0;line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.off{background:var(--muted)}
.side-foot button{background:none;border:0;padding:0;color:var(--side-fg);text-decoration:underline;cursor:pointer;font-size:.74rem}

.main{min-width:0;padding-block:20px 48px;padding-inline:clamp(16px, 2vw, 32px)}
.wrap{max-width:1600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin-top:4px;color:var(--muted);max-width:70ch}
.eyebrow{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* controls */
.btn{text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink);line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.input{resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--panel)}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0}
.fg > label{font-weight:600;font-size:.82rem}
.hint{font-size:.75rem;color:var(--muted)}
.err{color:var(--bad);font-size:.82rem}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}
.kpi .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:.78rem;color:var(--muted)}
a.kpi:hover{border-color:var(--muted)}
.kpi.attn{background:var(--warn-soft);border-color:transparent}
.kpi.attn .v{color:var(--warn)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:6px;font-size:.85rem}
.banner.info{background:var(--info-soft)} .banner.info b{color:var(--info)}
.banner.warn{background:var(--warn-soft)} .banner.warn b{color:var(--warn)}
.banner code{font-family:var(--f-mono);font-size:.8rem}

.pill{text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-bad{color:var(--bad);background:var(--bad-soft)} .p-info{color:var(--info);background:var(--info-soft)} .p-mute{color:var(--muted);background:var(--panel-2)}
.vault-tag{font-size:.74rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--panel-2)}
.src{font-size:.76rem;font-weight:600;white-space:nowrap}
.src i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--muted)}

/* bars & chart */
.vbars{display:flex;flex-direction:column;gap:11px}
.vbar{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:.84rem}
.vbar .track{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.vbar .fill{height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.vbar .n{text-align:right;font-family:var(--f-mono)}
.spark{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:84px}
.spark div{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark div.zero{background:var(--line)}
.spark-x{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-size:.64rem;color:var(--muted);text-align:center;margin-top:4px;font-family:var(--f-mono)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel-2)}
td.t b{display:block;font-weight:600}
td.t span{font-size:.78rem;color:var(--muted)}
.conf{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:.78rem}
.conf .m{width:38px;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.conf .m i{display:block;height:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .input{width:auto}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:.95rem}

/* upload & pipeline */
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:30px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--panel-2);cursor:pointer;transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dz svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6}
.progress{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);width:min(320px,100%)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prow{display:grid;grid-template-columns:52px minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow img,.prow .ph{width:52px;height:68px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--panel-2)}
.prow .fn{font-family:var(--f-mono);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.segs i.done{background:var(--ok);border-color:var(--ok)}
.segs i.act{background:var(--accent);border-color:var(--accent);animation:pulse 1s infinite}
.segs i.fail{background:var(--bad);border-color:var(--bad)}
.stage-l{font-size:.72rem;color:var(--muted);margin-top:4px}
@keyframes pulse{50%{opacity:.4}}

/* review */
.rcard{display:grid;grid-template-columns:300px minmax(0,1fr)}
.rcard + .rcard{border-top:1px solid var(--line)}
.rshot{padding:16px;background:var(--panel-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.shot-img{width:100%;max-height:440px;object-fit:contain;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:zoom-in}
.rbody{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.74rem;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.field.flag .input{border-color:var(--warn);background:var(--warn-soft)}
.field .ev{display:none!important}
.exp-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.ocr{font-family:var(--f-mono);font-size:.74rem;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--muted);max-height:220px;overflow:auto;margin:0}
details summary{cursor:pointer;font-size:.78rem;font-weight:600;color:var(--muted)}

/* drawer & lightbox */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.db{overflow-y:auto;padding:18px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.kv .k{font-size:.72rem;font-weight:600;color:var(--muted)}
.kv .v{font-weight:600}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}

/* admin */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.switch{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:2px 0 0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:18px}
.switch input:disabled{opacity:.5}
.switch b{display:block;font-size:.86rem}
.switch span span{font-size:.78rem;color:var(--muted)}
.tier{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.tier .order{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:center}
.tier .cond{display:flex;gap:6px;align-items:center;font-size:.82rem;white-space:nowrap}
.tier .cond .input{width:70px;font-family:var(--f-mono)}
.tester{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;align-self:start}
.result{font-family:var(--f-display);font-size:1.25rem;font-weight:700;color:var(--accent)}
.col-row{display:grid;grid-template-columns:30px minmax(0,1fr) 110px 100px 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.col-row:last-child{border-bottom:0}
.col-letter{font-family:var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;text-align:center;font-size:.75rem}
.col-row .switch{padding:0;border:0}
.mv{display:flex;gap:4px}
.radio-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.radio-card.off{opacity:.6;cursor:not-allowed}
.integ{display:flex;gap:14px;align-items:flex-start;padding:16px}
.integ + .integ{border-top:1px solid var(--line)}
.integ .ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none;color:#fff}
.integ .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.steps{margin:6px 0 0;padding-left:18px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.steps code{font-family:var(--f-mono);font-size:.76rem;color:var(--ink)}
.log .li{display:grid;grid-template-columns:150px 120px minmax(0,1fr);gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:.84rem}
.log .li:last-child{border-bottom:0}

/* login & toasts */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:min(380px,100%);padding:24px;display:flex;flex-direction:column;gap:16px}
.login-card .brand{padding:0}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-weight:600;font-size:.85rem;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad)}
.skeleton{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:12px;overflow-x:auto;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .brand small,.side-foot,.navgroup .label{display:none}
  .navgroup{flex-direction:row}
  .nav a{padding:6px 9px;white-space:nowrap}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--accent)}
  .g-2,.g-2e,.g-3{grid-template-columns:minmax(0,1fr)}
  .rcard{grid-template-columns:minmax(0,1fr)} .rshot{border-right:0;border-bottom:1px solid var(--line)}
  .db{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:52px minmax(0,1fr) auto}
  .prow .segwrap{grid-column:2/-1}

let jobsReq = 0;
async function loadJobs() {
  const f = S.jobFilter, my = ++jobsReq;
  const qs = new URLSearchParams({ q: f.q, vault: f.vault, status: f.status, source: f.source });
  const d = await api('/jobs?' + qs);
  if (my !== jobsReq || !$('#jt')) return;
  S.jobs = d.items;
  const exp = new URLSearchParams({ vault: f.vault, source: f.source, q: f.q, status: f.status === 'all' ? 'synced' : f.status });
  $('#xlsxBtn').href = withT('/api/export.xlsx?' + exp); $('#csvBtn').href = withT('/api/export.csv?' + exp);
  $('#cnt').textContent = `${d.items.length} job${d.items.length === 1 ? '' : 's'}`;
  $('#jt').innerHTML = d.items.length ? `<table><thead><tr><th>ID</th><th>Job title / company</th><th>Location</th><th>Experience</th><th>Salary</th><th>Vault</th><th>Source</th><th>Confidence</th><th>Status</th></tr></thead><tbody>
    ${d.items.map(j => `<tr class="click" data-open="${j.id}"><td class="mono muted small">${j.code}</td><td class="t"><b>${esc(j.title || '—')}</b><span>${esc(j.company || '—')}</span></td><td>${esc(j.location || '—')}${j.work_mode ? `<div class="muted small">${esc(j.work_mode)}</div>` : ''}</td><td class="mono">${esc(j.experience || '—')}</td><td>${esc(j.salary || '—')}</td><td><span class="vault-tag">${esc(j.vault)}</span></td><td>${src(j.source_app)}</td><td>${conf(j.confidence)}</td><td>${pill(j.status)}</td></tr>`).join('')}
  </tbody></table>` : `<div class="empty"><b>No jobs match</b><span>Try another vault or status, or clear the search.</span></div>`;
}
function copyExcel() {
  const cols = S.settings.columns.filter(c => c.enabled);
  const rows = S.jobs.filter(j => S.jobFilter.status !== 'all' || j.status === 'synced');
  if (!rows.length) return toast('No jobs in the sheet to copy', true);
  const val = (j, k) => k === 'experience' ? j.experience : k === 'screenshot' ? (j.filename || '') : k === 'created_at' ? (j.created_at || '').slice(0, 10) : (j[k] ?? '');
  const tsv = [cols.map(c => c.label).join('\t'), ...rows.map(j => cols.map(c => String(val(j, c.key)).replace(/[\t\n]/g, ' ')).join('\t'))].join('\n');
  const done = () => toast(`${rows.length} rows copied · paste into Excel`);
  const fallback = () => { const t = document.createElement('textarea'); t.value = tsv; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch { toast('Copy failed. Use Download Excel instead.', true); } t.remove(); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(tsv).then(done, fallback); else fallback();
}

function fieldInput(j, k, label, extra = '') {

      </div><div class="row">
        <button class="btn" id="editBtn" data-edit="${j.id}">Edit</button>
        <button class="btn primary" id="saveBtn" data-save="${j.id}" hidden>Save changes</button>
        ${j.status === 'review' ? `<button class="btn ok" data-approve="${j.id}" data-from="drawer">Approve &amp; add to sheet</button>` : ''}
      </div></div></aside>`;
  $('.drawer .btn[data-close]').focus();
}
function closeLayer() { $('#layer').innerHTML = ''; }

/* ---------- router ---------- */
let current = null;
async function render(silent) {
  const key = (location.hash || '#dashboard').slice(1).split('?')[0];
  const view = V[key] ? key : 'dashboard';
  $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  if (!silent) { $('#view').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>'; }
  try {
    const keepScroll = silent ? window.scrollY : 0;
    const html = await V[view]();
    if ((location.hash || '#dashboard').slice(1).split('?')[0] !== key && V[key]) return;
    const active = document.activeElement?.id;
    $('#view').innerHTML = html;
    current = view;
    if (view === 'jobs') await loadJobs();
    if (view === 'rules') testRule();
    if (silent) { window.scrollTo(0, keepScroll); if (active && $('#' + active)) $('#' + active).focus(); } else window.scrollTo(0, 0);
  } catch (e) { if (e.message !== 'Please sign in') $('#view').innerHTML = `<div class="banner warn"><b>Could not load this page</b><span>${esc(e.message)}. Check that the server is running, then reload.</span></div>`; }
  refreshCounts();
}
async function refreshCounts() {
  try {
    const s = await api('/stats');
    S.stats = s;
    $('#revCount').hidden = !s.review; $('#revCount').textContent = s.review;
    $('#procCount').hidden = !s.processing; $('#procCount').textContent = s.processing;
    $('#sideFoot').innerHTML = `<span class="dot ${s.provider === 'mock' ? 'warn' : ''}"></span>AI reader: ${s.provider === 'mock' ? 'demo mode' : s.provider === 'gemini' ? 'Gemini' : 'OpenAI'}<br>${s.processing ? `<span class="dot warn"></span>${s.processing} processing` : '<span class="dot off"></span>Queue empty'}<br>${S.token && S.token !== 'open' ? '<button data-act="signout">Sign out</button>' : '<span style="opacity:.7">Built by Dr. Design</span>'}`;
    schedulePoll(s.processing > 0);
  } catch {}
}
function schedulePoll(busy) {
  clearTimeout(S.pollTimer);
  S.pollTimer = setTimeout(async () => {
    if (document.hidden || $('#layer').innerHTML) return schedulePoll(busy);
    if (current === 'inbox') {
      const d = await api('/screenshots?limit=100').catch(() => null);
      if (d && $('#shotList')) { $('#shotList').innerHTML = shotRows(d.items); $('#qInfo').textContent = d.queue.queued + d.queue.running ? `${d.queue.running} reading now · ${d.queue.queued} waiting` : 'Queue is empty'; }
      refreshCounts();
    } else if (busy && ['dashboard', 'review'].includes(current) && !document.activeElement?.closest?.('.rcard')) render(true);
    else refreshCounts();
  }, busy ? 2000 : 15000);
}

/* ---------- uploads ---------- */
function upload(files) {
  files = [...files].filter(f => /^image\//.test(f.type));
  if (!files.length) return toast('Choose PNG, JPG, WEBP or HEIC images', true);
  const fd = new FormData(); files.forEach(f => fd.append('files', f, f.name || 'pasted.png'));
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/screenshots');
  if (S.token) xhr.setRequestHeader('Authorization', `Bearer ${S.token}`);
  const prog = $('#upProg');
  if (prog) { prog.hidden = false; $('#upTxt').textContent = `Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`; }
  xhr.upload.onprogress = e => { if (e.lengthComputable && $('#upBar')) $('#upBar').style.width = (e.loaded / e.total * 100) + '%'; };
  xhr.onload = () => {
    if ($('#upProg')) $('#upProg').hidden = true;
    let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 401) return showLogin();
    if (xhr.status >= 300) return toast(body.error || 'Upload failed', true);
    toast(`${files.length} screenshot${files.length > 1 ? 's' : ''} added · reading now`);
    if (current === 'inbox') render(true); else location.hash = '#inbox';
  };
  xhr.onerror = () => { if ($('#upProg')) $('#upProg').hidden = true; toast('Upload failed. Check your connection.', true); };
  xhr.send(fd);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-open],[data-close],[data-act],[data-approve],[data-reject],[data-restore],[data-retry],[data-delshot],[data-edit],[data-save],[data-zoom],#fs button,[data-rmtier],[data-cmv],[data-vault]');
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.zoom) { e.preventDefault(); const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = `<img src="${esc(d.zoom)}" alt="Screenshot">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; }
    if (d.open) { e.preventDefault(); return openJob(d.open); }
    if ('close' in d) return closeLayer();
    if (d.vault) { S.jobFilter.vault = d.vault; return; }
    if (t.matches('#fs button')) { S.jobFilter.status = d.s; $$('#fs button').forEach(b => b.classList.toggle('on', b === t)); return loadJobs(); }
    if (d.approve) {
      const root = d.from === 'drawer' ? $('#editForm') : t.closest('.rcard');
      t.disabled = true;
      try {
        const j = await api(`/jobs/${d.approve}/approve`, { method: 'POST', body: d.from === 'drawer' && $('.edit-v[hidden]') ? {} : collectFields(root) });
        toast(`${j.code} added to ${j.vault}`);
        if (d.from === 'drawer') closeLayer();
        const card = t.closest('.rcard'); if (card) card.remove();
        if (current === 'review' && !$('.rcard')) render(true); else if (current !== 'review') render(true); else refreshCounts();
      } catch (err) { t.disabled = false; fail(err); if (err.data?.missing && root) err.data.missing.forEach(m => root.querySelector(`[data-f="${m}"]`)?.closest('.field')?.classList.add('flag')); }
      return;
    }
    if (d.reject) { await api(`/jobs/${d.reject}/reject`, { method: 'POST' }); toast('Job rejected'); if ($('.drawer')) closeLayer(); const card = t.closest('.rcard'); if (card) { card.remove(); if (!$('.rcard')) render(true); else refreshCounts(); } else render(true); return; }
    if (d.restore) { await api(`/jobs/${d.restore}/restore`, { method: 'POST' }); toast('Moved to review queue'); closeLayer(); render(true); return; }
    if (d.retry) { await api(`/screenshots/${d.retry}/retry`, { method: 'POST' }); toast('Reading again'); render(true); return; }
    if (d.delshot) {
      if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Remove?'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = '✕'; } }, 3000); return; }
      await api(`/screenshots/${d.delshot}`, { method: 'DELETE' }); toast('Screenshot removed'); render(true); return;
    }
    if (d.edit) { $$('#editForm .view-v').forEach(x => x.hidden = true); $$('#editForm .edit-v').forEach(x => x.hidden = false); $('#editBtn').hidden = true; $('#saveBtn').hidden = false; $('#editForm [data-f]').focus(); return; }
    if (d.save) { const j = await api(`/jobs/${d.save}`, { method: 'PUT', body: collectFields($('#editForm')) }); toast(`${j.code} saved`); openJob(j.id); if (current === 'jobs') loadJobs(); return; }
    if (d.rmtier) { const tiers = readTiers(); tiers.splice(+d.rmtier, 1); $('#tiers').innerHTML = tiers.map((x, i) => tierRow(x, i, tiers.length)).join(''); return; }
    if (d.cmv) { const [i, dir] = d.cmv.split(':').map(Number); syncColDraft(); const [c] = colDraft.splice(i, 1); colDraft.splice(i + dir, 0, c); $('#colList').innerHTML = colRows(); return; }

    switch (d.act) {
      case 'copy': return copyExcel();
      case 'signout': return signOut();
      case 'drive': { t.disabled = true; const r = await api('/drive/sync', { method: 'POST' }); t.disabled = false; toast(r.busy ? 'A Drive check is already running' : r.added ? `${r.added} new screenshot${r.added > 1 ? 's' : ''} found` : 'No new screenshots in Drive'); render(true); return; }
      case 'addTier': { const tiers = readTiers(); const last = tiers[tiers.length - 1]; const prevBelow = Number(tiers[tiers.length - 2]?.below) || 0; tiers.splice(tiers.length - 1, 0, { name: 'New tier', below: prevBelow + 3 }); last.below = null; $('#tiers').innerHTML = tiers.map((x, i) => tierRow(x, i, tiers.length)).join(''); return; }
      case 'saveRules': {
        const body = { homeCountry: $('#rHome').value, remoteVault: $('#rRemote').value, globalVault: $('#rGlobal').value, tiers: readTiers() };
        const r = await api('/settings/rules', { method: 'PUT', body });
        await loadSettings(); toast(`Rules saved${r.moved ? ` · ${r.moved} job${r.moved > 1 ? 's' : ''} moved to a different vault` : ''}`); testRule(); return;
      }
      case 'saveCols': { syncColDraft(); await api('/settings/columns', { method: 'PUT', body: colDraft }); await loadSettings(); colDraft = structuredClone(S.settings.columns); $('#colList').innerHTML = colRows(); toast('Columns saved'); return; }
      case 'saveAi': {
        const body = { provider: document.querySelector('input[name=prov]:checked')?.value, threshold: +$('#thr').value, strict: $('#strict').checked, dedupe: $('#dedupe').checked, dedupeDays: +$('#dedupeDays').value, extraInstructions: $('#extra').value };
        await api('/settings/ai', { method: 'PUT', body }); await loadSettings(); toast('AI settings saved'); refreshCounts(); return;
      }
    }
  } catch (err) { fail(err); }
});
function syncColDraft() {
  $$('[data-clabel]').forEach(i => { colDraft[+i.dataset.clabel].label = i.value.trim() || colDraft[+i.dataset.clabel].label; });
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileIn') { upload(t.files); t.value = ''; }
  if (t.id === 'fv') { S.jobFilter.vault = t.value; loadJobs(); }
  if (t.id === 'fsrc') { S.jobFilter.source = t.value; loadJobs(); }
  if (t.dataset.creq) { syncColDraft(); const c = colDraft[+t.dataset.creq]; c.required = t.checked; if (t.checked) c.enabled = true; $('#colList').innerHTML = colRows(); }
  if (t.dataset.con) { syncColDraft(); colDraft[+t.dataset.con].enabled = t.checked; $('#colList').innerHTML = colRows(); }
  if (['tMode'].includes(t.id)) testRule();
});
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.jobFilter.q = t.value; loadJobs(); }, 250); }
  if (['tExp', 'tCountry'].includes(t.id)) testRule();
  if (t.id === 'thr') $('#thrV').textContent = t.value + '%';
  const card = t.closest?.('.rcard');
  if (card && ['country', 'work_mode', 'exp_min'].includes(t.dataset.f)) {
    const f = collectFields(card);
    api('/rules/test', { method: 'POST', body: { country: f.country, work_mode: f.work_mode, exp_min: f.exp_min } }).then(r => { const el = card.querySelector('.vault-prev'); if (el) el.textContent = r.vault; }).catch(() => {});
  }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest?.('#dz'); if (dz) { e.preventDefault(); dz.classList.add('over'); } }));
document.addEventListener('dragleave', e => { const dz = e.target.closest?.('#dz'); if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest?.('#dz'); if (dz) { e.preventDefault(); dz.classList.remove('over'); upload(e.dataTransfer.files); } else if (e.dataTransfer?.files?.length) e.preventDefault(); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('paste', e => {
  if (current !== 'inbox') return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) upload(files);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = $('.lightbox'); if (lb) lb.remove(); else closeLayer(); } });
window.addEventListener('hashchange', () => { closeLayer(); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCounts(); });

/* ---------- boot ---------- */
async function loadSettings() { S.settings = await api('/settings'); }
async function boot() {
  try {
    const h = await fetch('/api/health').then(r => r.json());
    if (h.authRequired && (!S.token || S.token === 'open')) return showLogin();
    if (!h.authRequired) S.token = 'open';
    await loadSettings();
    $('#app').hidden = false; $('#login').hidden = true;
    render();
  } catch (e) {
    if (e.message === 'Please sign in') return;
    document.body.innerHTML = `<div class="login"><div class="panel login-card"><h2>Server not reachable</h2><p class="muted">Start it with <code>npm start</code> and reload this page.</p></div></div>`;
  }
}
boot();
})();

</script>
